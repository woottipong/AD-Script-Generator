# Production: build and start (or update to the current code) with
#   docker compose -f docker-compose.prod.yml up -d --build
# Before starting or upgrading, define APP_URL, KEYCLOAK_ISSUER_URL, KEYCLOAK_CLIENT_ID,
# and SESSION_SECRET in .env. Set GEMINI_API_KEY to enable AI generation.
# Optional .env overrides: APP_PORT (default 3000), APP_BIND (e.g. 127.0.0.1 behind a reverse proxy), IMAGE_TAG (default latest).
# Jobs live in ./.data on the host; the database schema migrates itself on start.
# Jobs saved as job.json (before schema version 3) are not carried over: clear ./.data/jobs when upgrading from them.
name: envisio

services:
  envisio:
    build:
      context: .
      target: production
    image: envisio:${IMAGE_TAG:-latest}
    init: true
    ports:
      - "${APP_BIND:+${APP_BIND}:}${APP_PORT:-3000}:3000"
    env_file: .env
    volumes:
      - ./.data:/app/.data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
