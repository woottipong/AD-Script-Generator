version: '3.9'

services:
  ad-script-generator:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ad_jobs_data:/app/.data/jobs
    restart: unless-stopped

volumes:
  ad_jobs_data:
