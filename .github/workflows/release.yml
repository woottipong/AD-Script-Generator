name: release

env:
  REGISTRY_RTT: registry.rtt.in.th

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "feature-**"
      - "fix-**"
      - "beta-**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Match the toolchain in the Dockerfile (BUN_VERSION, NODE_VERSION)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # vite build runs inside the Docker build below
      - name: Run checks
        run: bun run lint && bun run test

      - name: Determine Environment & Repositories
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "is_prod=true" >> "$GITHUB_OUTPUT"
            RAW_NAME="${GITHUB_REPOSITORY//\//-}"
            echo "dockerhub_repo=${RAW_NAME,,}" >> "$GITHUB_OUTPUT"
          else
            echo "is_prod=false" >> "$GITHUB_OUTPUT"
          fi
          # Docker tags cannot contain "/", which workflow_dispatch branch names such as chore/x do
          echo "tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Login to RTT Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_RTT }}
          username: ${{ secrets.REGISTRY_RTT_USERNAME }}
          password: ${{ secrets.REGISTRY_RTT_TOKEN }}

      - name: Login to Docker Hub (Production only)
        if: steps.meta.outputs.is_prod == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.REGISTRY_SPINSOFT_USERNAME }}
          password: ${{ secrets.REGISTRY_SPINSOFT_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY_RTT }}/${{ github.repository }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.is_prod == 'true' && format('{0}/{1}:{2}', secrets.REGISTRY_SPINSOFT_USERNAME, steps.meta.outputs.dockerhub_repo, steps.meta.outputs.tag) || '' }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
